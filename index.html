<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8"
        <meta name="viewport"
        content="width=device-width,initial-scale=1.0">
<title>Calculator Clone</title>
<link rel="stylesheet"
href="style.css">
    </head>
<body>
    <main class="Calculator">
        <div class="display"
        aria-label="Calculator display">
        <span>0</span>
    </div>
    <div class="buttons">
        <button class="clear">AC</button>
        <button>00</button>
        <button>%</button>
        <button class="operator">&divide;</button>
        <button>7</button>
        <button>8</button>
        <button>9</button>
        <button class="operator">&times;</button>
        <button>4</button>
        <button>5</button>
        <button>6</button>
        <button class="operator">-</button>
        <button>1</button>
        <button>2</button>
        <button>3</button>
        <button class="operator">+</button>
        <button class="zero">0</button>
        <button class="decimal">.</button>
        <button class="operator">=</button>
    </div>
    </main>
</body>
</html>
